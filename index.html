<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Филмотека</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #141414; color: white; padding: 20px; margin: 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { margin: 0; }
        .btn-add { background-color: #e50914; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-add:hover { background-color: #ff1e27; }
        .search-container { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .search-container input, .search-container select, .search-container button { padding: 10px; margin-right: 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        .search-container button { background: #e50914; border: none; cursor: pointer; font-weight: bold; }
        .search-container button:hover { background: #ff1e27; }
        .movie-grid { display: flex; flex-wrap: wrap; gap: 20px; }
        
        /* Изглед картице и позиционирање дугмета за брисање */
        .movie-card { background: #333; width: 250px; border-radius: 8px; overflow: hidden; border: 1px solid #444; display: flex; flex-direction: column; position: relative; }
        .movie-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .badge { background: #e50914; padding: 3px 8px; border-radius: 4px; font-size: 12px; align-self: flex-start; margin-bottom: 10px; }
        .movie-info p { font-size: 14px; color: #bbb; line-height: 1.4; margin: 5px 0; }
        
        /* Дугме за брисање (X) у горњем десном углу картице */
        .btn-delete { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); color: #ff3333; border: 1px solid #ff3333; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 16px; transition: 0.2s; z-index: 2; }
        .btn-delete:hover { background: #ff3333; color: white; transform: scale(1.1); }
        
        /* Искачући прозор (Modal) за додавање */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 10; }
        .modal-content { background: #222; padding: 30px; border-radius: 8px; width: 400px; border: 1px solid #444; }
        .modal-content h2 { margin-top: 0; color: #e50914; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #555; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        .btn-save { background: #e50914; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Заглавље са насловом и дугметом десно -->
    <div class="header-container">
        <h1>🎬 Моји Предлози за Филмове и Серије</h1>
        <button class="btn-add" onclick="openModal()">➕ Додај предлог</button>
    </div>

    <!-- Претрага и филтрирање -->
    <div class="search-container">
        <input type="text" id="search" placeholder="Претражи по жанру (нпр. horror)...">
        <select id="typeFilter">
            <option value="sve">Све порекло</option>
            <option value="domaci">Домаћи</option>
            <option value="strani">Страни</option>
        </select>
        <button onclick="filtriraj()">Тражи</button>
    </div>

    <h2>📽️ Листа предлога</h2>
    <div class="movie-grid" id="movieGrid"></div>

    <!-- Модал (Искачући прозор) за унос података -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <h2>Додај нови предлог</h2>
            <form id="movieForm">
                <div class="form-group">
                    <label>Админ Код (Обавезно):</label>
                    <input type="password" id="adminCode" required placeholder="Унеси шифру...">
                </div>
                <div class="form-group">
                    <label>Наслов:</label>
                    <input type="text" id="title" required placeholder="Назив филма или серије...">
                </div>
                <div class="form-group">
                    <label>Жанр:</label>
                    <input type="text" id="genre" required placeholder="нпр. horror, komedija...">
                </div>
                <div class="form-group">
                    <label>Порекло:</label>
                    <select id="origin">
                        <option value="strani">Страни</option>
                        <option value="domaci">Домаћи</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Линк до слике/постера:</label>
                    <input type="url" id="image" placeholder="https://..." value="https://placeholder.com">
                </div>
                <div class="form-group">
                    <label>Опис:</label>
                    <textarea id="description" rows="3" placeholder="Кратак опис..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Откажи</button>
                    <button type="submit" class="btn-save">Сачувај</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Учитавање свих филмова са Node.js бекенда при покретању сајта [1]
        async function ucitajFilmove() {
            try {
                const res = await fetch('/api/movies');
                const movies = await res.json();
                prikaziFilmove(movies);
            } catch (err) {
                console.error("Грешка при учитавању:", err);
            }
        }

        // Рендеровање картица на екрану
        function prikaziFilmove(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            if(movies.length === 0) {
                grid.innerHTML = '<p>Нема пронађених филмова.</p>';
                return;
            }
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <button class="btn-delete" onclick="obrisiFilm('${movie._id}')" title="Обриши предлог">×</button>
                    <img src="${movie.image || 'https://placeholder.com'}" alt="Постер" style="width:100%; height:320px; object-fit:cover;">
                    <div class="movie-info">
                        <span class="badge">${movie.origin === 'domaci' ? 'Домаћи' : 'Страни'}</span>
                        <h3>${movie.title}</h3>
                        <p><strong>Жанр:</strong> ${movie.genre}</p>
                        <p>${movie.description || ''}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Функција за брисање филма уз проверу кода [1]
        async function obrisiFilm(id) {
            const kod = prompt("Унеси админ код за брисање филма:");
            
            if (kod === null) return; // Корисник је отказао унос
            
            if (kod !== '11111111') {
                alert("Погрешан админ код!");
                return;
            }

            if (confirm("Да ли сте сигурни да желити да обришете овај предлог?")) {
                try {
                    const res = await fetch(`/api/movies/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (res.ok) {
                        alert("Предлог је успешно обрисан!");
                        ucitajFilmove(); // Освежавамо листу
                    } else {
                        alert("Грешка при брисању са сервера.");
                    }
                } catch (err) {
                    console.error("Грешка:", err);
                }
            }
        }

        // Слање захтева са филтерима претраге серверу [1]
        async function filtriraj() {
            const search = document.getElementById('search').value.toLowerCase();
            const origin = document.getElementById('typeFilter').value;
            try {
                const res = await fetch(`/api/movies?genre=${search}&origin=${origin}`);
                const movies = await res.json();
                prikaziFilmove(movies);
            } catch (err) {
                console.error(err);
            }
        }

        // Модал контроле
        function openModal() { document.getElementById('movieModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('movieForm').reset(); document.getElementById('movieModal').style.display = 'none'; }

        // Чување новог филма (POST захтев) [1]
        document.getElementById('movieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('adminCode').value;
            if (code !== '11111111') {
                alert('Погрешан админ код!');
                return;
            }

            const newMovie = {
                title: document.getElementById('title').value,
genre: document.getElementById('genre').value.toLowerCase(),origin: document.getElementById('origin').value,image: document.getElementById('image').value,description: document.getElementById('description').value};try {const res = await fetch('/api/movies', {method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify(newMovie)});if (res.ok) {closeModal();ucitajFilmove();} else {alert('Грешка при чувању.');}} catch (err) {console.error(err);}});// Покрени учитавање филмова чим се страница отвориucitajFilmove();
